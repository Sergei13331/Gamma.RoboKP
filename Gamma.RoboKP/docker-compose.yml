version: '3.9'
services:
  postgres:
    container_name: postgresRoboKP
    image: postgres:latest
    environment:
      POSTGRES_DB: "RoboKP"
      POSTGRES_USER: "postgresRoboKP"
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres-dataRoboKP:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  postgres-dataRoboKP:
      